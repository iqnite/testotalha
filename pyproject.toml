[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testotalha"
dynamic = ["version"]
description = "Diese Python-Modul gibt eure Programme mehr TESTO checkt ihr?"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "iqnite" }]
dependencies = []
keywords = ["fun"]

[project.urls]
Repository = "https://github.com/iqnite/testotalha"

[project.scripts]
spamoji = "testotalha.main:main"

[tool.setuptools]
packages = ["testotalha"]

[tool.setuptools.dynamic]
version = { attr = "testotalha.metadata.__version__" }
